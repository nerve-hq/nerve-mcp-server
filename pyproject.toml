[project]
name = "nerve-mcp"
version = "0.0.1"
description = "A MCP server for Nerve"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.8.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.scripts]
nerve-mcp = "nerve_mcp:main"
